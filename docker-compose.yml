services:
  db:
    image: postgres:16
    container_name: alcomy_postgres
    environment:
      POSTGRES_DB: alcomy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
volumes:
  postgres-data:
    driver: local
